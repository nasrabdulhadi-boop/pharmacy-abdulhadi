name: Repair preview JSX
on:
  push:
    branches:
      - fix/purchase-autofill-product-currency-20261022
    paths:
      - .github/workflows/repair-preview-jsx.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair malformed price currency expressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          bad="<span>{money(product?.purchase_price)} {product?.sale_currency==='USD'?'</div>"
          fixed="<span>{money(product?.purchase_price)} {product?.sale_currency==='USD'?'$':'ل.س'}</span></div>"
          count=s.count(bad)
          if count != 4: raise SystemExit(f'Expected four broken expressions, found {count}')
          p.write_text(s.replace(bad,fixed))
          PY
      - name: Verify source and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "fix: repair four JSX currency conditions after successful build"
          git push
