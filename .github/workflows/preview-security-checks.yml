name: Preview Security Checks
on:
  push:
    branches:
      - feature/system-administration-center-preview-20261028
  workflow_dispatch:
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for preview
        run: npm install --package-lock=false --ignore-scripts
      - name: Run permission and sanitization tests
        run: npm test
      - name: Build preview
        run: npm run build
      - name: Reject auth mutation in production build
        env:
          VITE_ENABLE_AUTH_MUTATIONS: 'true'
          VITE_SUPABASE_URL: https://eewjjzgwoaxhojnjvzgq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key
        run: |
          if npm run build; then
            echo 'SECURITY FAILURE: production auth mutation build was allowed'
            exit 1
          fi
          echo 'Production auth mutation build correctly rejected'
      - name: Reject auth mutation on wrong staging URL
        env:
          VITE_ENABLE_AUTH_MUTATIONS: 'true'
          VITE_SUPABASE_URL: https://invalid.example.test
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key
        run: |
          if npm run build -- --mode staging; then
            echo 'SECURITY FAILURE: non-isolated staging auth mutation build was allowed'
            exit 1
          fi
          echo 'Non-isolated staging auth mutation build correctly rejected'
