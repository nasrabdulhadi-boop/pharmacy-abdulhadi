name: Preview Security Checks
on:
  push:
    branches:
      - feature/system-administration-center-preview-20261028
  workflow_dispatch:
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for preview
        run: npm install --package-lock=false --ignore-scripts
      - name: Run permission and sanitization tests
        run: npm test
      - name: Build preview
        run: npm run build
